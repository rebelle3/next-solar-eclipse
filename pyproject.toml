[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eclipsepath"
version = "1.0.0"
description = "Solar eclipse paths and coverage bands from JPL ephemerides"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["skyfield>=1.45", "numpy>=1.20"]

[project.scripts]
eclipsepath = "eclipsepath.cli:main"

[tool.setuptools.packages.find]
include = ["eclipsepath*"]
