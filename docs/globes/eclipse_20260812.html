<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipse globe</title>
<style>
  :root {
    --surface: #101319; --panel: #171b23; --ink: #f2f3f5; --ink-2: #9aa1ad;
    --line: #39404e; --accent: #7fb2f0; --gold: #d4a017;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface);
               color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* Both controls float over the globe rather than beside it, so the thing
     being described is never boxed into a corner of its own screen. */
  .glass {
    background: color-mix(in srgb, var(--panel) 58%, transparent);
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: 12px;
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.38);
  }
  /* Without the blur the same translucency is just a smear over the coastlines,
     so where it is unavailable the glass goes nearly solid instead. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: color-mix(in srgb, var(--panel) 95%, transparent); }
  }

  #info { position: fixed; left: 16px; top: 16px; width: 322px;
          max-width: calc(100vw - 32px); padding: 14px 16px; }
  #info.shut { width: auto; padding: 6px; }
  #info.shut #infoBody { display: none; }
  #infoToggle { position: absolute; top: 10px; right: 10px; }
  #info.shut #infoToggle { position: static; }
  h1 { font-size: 15px; margin: 0 0 3px; font-weight: 600; padding-right: 52px; }
  .sub { color: var(--ink-2); font-size: 12px; margin: 0 0 12px; }
  .reads { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
           font-size: 12px; color: var(--ink-2); margin: 0 0 4px; }
  .reads b { color: var(--ink); font-weight: 500;
             font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 9px;
         flex-wrap: wrap; }
  label.check { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px;
                align-items: center; cursor: pointer; }
  .foot { margin-top: 12px; padding-top: 10px;
          border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
          font-size: 11px; color: var(--ink-2); }

  /* The transport runs the width of the screen because what it controls is
     time, and time is the one axis the picture does not already show. */
  #transport { position: fixed; left: 16px; right: 16px; bottom: 16px;
               padding: 10px 14px; display: flex; align-items: center;
               gap: 14px; flex-wrap: wrap; }
  .clock { font: 600 17px/1 ui-monospace, monospace;
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .speed { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .speed span { color: var(--ink-2); font-size: 12px; white-space: nowrap;
                min-width: 8.5ch; text-align: right;
                font-variant-numeric: tabular-nums; }

  #timeline { position: relative; flex: 1 1 260px; height: 26px;
              display: flex; align-items: center; }
  #timeline .track, #timeline .fill, #timeline .band {
    position: absolute; border-radius: 2px; pointer-events: none; }
  #timeline .track, #timeline .fill { top: 9px; height: 4px; }
  #timeline .track { left: 0; right: 0;
                     background: color-mix(in srgb, var(--ink) 18%, transparent); }
  #timeline .fill { left: 0; background: var(--accent); opacity: 0.75; }
  /* Gold here is the gold of the path drawn on the globe: the stretch of the
     eclipse during which the umbra is somewhere on the ground.  On its own rail
     below the groove, so it annotates the progress rather than covering it. */
  #timeline .band { top: 20px; height: 3px; background: var(--gold);
                    opacity: 0.9; }
  #timeline .mark { position: absolute; top: 4px; width: 2px; height: 14px;
                    background: var(--ink); opacity: 0.45; pointer-events: none;
                    border-radius: 1px; }
  #scrub { position: relative; width: 100%; margin: 0; background: transparent;
           -webkit-appearance: none; appearance: none; height: 22px; }
  #scrub::-webkit-slider-runnable-track { height: 22px; background: transparent; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 15px;
      height: 15px; border-radius: 50%; background: var(--ink);
      border: 3px solid var(--accent); margin-top: 3.5px; cursor: pointer; }
  #scrub::-moz-range-track { height: 22px; background: transparent; }
  #scrub::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%;
      background: var(--ink); border: 3px solid var(--accent); cursor: pointer; }

  button { background: color-mix(in srgb, var(--ink) 10%, transparent);
           color: var(--ink);
           border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
           border-radius: 7px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  #play { min-width: 74px; }
  input[type=checkbox] { accent-color: var(--accent); }

  #error { position: fixed; inset: 0; display: none; place-content: center;
           padding: 40px; text-align: center; color: var(--ink-2); }

  @media (max-width: 720px) {
    #info { left: 12px; top: 12px; }
    #transport { left: 10px; right: 10px; bottom: 10px; gap: 10px; padding: 9px 12px; }
    .clock { font-size: 15px; }
    /* The rate label reserves room for its widest reading so the buttons stop
       shuffling; on a phone that reservation is what pushes the row over the
       edge and costs a whole third line. */
    .speed { margin-left: auto; }
    .speed span { min-width: 0; }
    #timeline { flex-basis: 100%; order: -1; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="error"></div>
<div id="info" class="glass">
  <button id="infoToggle" type="button" aria-controls="infoBody" aria-expanded="true">Hide</button>
  <div id="infoBody">
    <h1 id="title">Eclipse</h1>
    <p class="sub" id="standfirst"></p>
    <div class="reads">
      <span>Deepest now</span><b id="peak">&mdash;</b>
      <span>Umbra at</span><b id="where">&mdash;</b>
      <span>Sun altitude</span><b id="alt">&mdash;</b>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="showPath" checked> Path</label>
      <label class="check"><input type="checkbox" id="showCoast" checked> Coast</label>
      <label class="check"><input type="checkbox" id="follow"> Follow</label>
      <label class="check"><input type="checkbox" id="showCone"> Cone</label>
    </div>
    <div class="row">
      <button id="wide">Show the Moon</button>
    </div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<div id="transport" class="glass">
  <button id="play">Play</button>
  <div id="timeline">
    <div class="track"></div>
    <div class="fill" id="fill"></div>
    <div class="band" id="band"></div>
    <div class="mark" id="mark"></div>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1"
           aria-label="Time through the eclipse">
  </div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="speed">
    <button id="slower" aria-label="Slower">&minus;</button>
    <span id="rate"></span>
    <button id="faster" aria-label="Faster">+</button>
  </div>
</div>

<script>

const SCENE = JSON.parse(document.getElementById('scene').textContent);

// ---------------------------------------------------------------- geometry --
// The same quantities the Python package computes, in the same units: ITRF
// kilometres, apparent radii in radians, obscuration as a fraction of the
// Sun's disc area.  Where the shader does this per pixel, these are for the
// readouts and for the tests to compare against.

const C = SCENE.constants;
const E2 = 1.0 - (C.earth_b_km * C.earth_b_km) / (C.earth_a_km * C.earth_a_km);

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t +
                (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
                (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}

// Positions arrive on a regular grid of instants.  Interpolating them with a
// cubic through the two samples either side rather than a straight line is
// what lets the cadence stay at a minute: the error of a Catmull-Rom spline
// falls as the fourth power of the spacing, so shortening the step by half
// takes a sixteenth off it.
function sampleTrack(track, index, t) {
  const n = SCENE.time.count;
  const i1 = Math.min(Math.max(index, 0), n - 1);
  const i0 = Math.max(i1 - 1, 0), i2 = Math.min(i1 + 1, n - 1),
        i3 = Math.min(i1 + 2, n - 1);
  const out = [0, 0, 0];
  for (let k = 0; k < 3; k++) {
    out[k] = catmull(track[3 * i0 + k], track[3 * i1 + k],
                     track[3 * i2 + k], track[3 * i3 + k], t);

  return out;

function stateAt(tt) {
  const x = (tt - SCENE.time.tt0) / SCENE.time.step_days;
  const index = Math.floor(x);
  const frac = x - index;
  return {
    sun: sampleTrack(SCENE.sun_itrf_km, index, frac),
    moon: sampleTrack(SCENE.moon_itrf_km, index, frac),

function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function len(a) { return Math.sqrt(dot(a, a)); }
function unit(a) { const L = len(a); return [a[0] / L, a[1] / L, a[2] / L]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0]];

// The angle between two unit vectors, by the chord rather than by the dot
// product.  Near zero separation -- which is the entire interesting range,
// the Sun being half a degree wide -- acos of a dot product close to 1 throws
// away most of the significant figures it was given.
function angleBetween(a, b) {
  const u = unit(a), v = unit(b);
  const d = [u[0] - v[0], u[1] - v[1], u[2] - v[2]];
  return 2.0 * Math.asin(Math.min(1.0, len(d) / 2.0));

function obscuration(rs, rm, sep) {
  if (sep >= rs + rm) return 0.0;
  if (sep <= rm - rs) return 1.0;
  if (sep <= rs - rm) return (rm / rs) * (rm / rs);
  const d = Math.max(sep, 1e-30);
  const c1 = Math.min(1, Math.max(-1, (d * d + rs * rs - rm * rm) / (2 * d * rs)));
  const c2 = Math.min(1, Math.max(-1, (d * d + rm * rm - rs * rs) / (2 * d * rm)));
  const tri = Math.max(0, (-d + rs + rm) * (d + rs - rm) *
                          (d - rs + rm) * (d + rs + rm));
  const area = rs * rs * Math.acos(c1) + rm * rm * Math.acos(c2)
               - 0.5 * Math.sqrt(tri);
  return Math.min(1, Math.max(0, area / (Math.PI * rs * rs)));

function geodeticToItrf(latDeg, lonDeg) {
  const lat = latDeg * Math.PI / 180, lon = lonDeg * Math.PI / 180;
  const s = Math.sin(lat);
  const n = C.earth_a_km / Math.sqrt(1.0 - E2 * s * s);

// eclipsepath.circumstances.state_at, and the thing the tests hold the shader
// and the package to.
function circumstancesAt(latDeg, lonDeg, tt) {
  const s = stateAt(tt);
  const p = geodeticToItrf(latDeg, lonDeg);
  const vs = sub(s.sun, p), vm = sub(s.moon, p);
  const rs = Math.asin(C.r_sun_km / len(vs));
  const rm = Math.asin(C.r_moon_km / len(vm));

  const alt = 90.0 - angleBetween(vs, zenithAt(p)) * 180.0 / Math.PI;
  const up = alt > C.horizon_altitude_deg;

    obscuration: up ? obscuration(rs, rm, sep) : 0.0,
    raw_obscuration: obscuration(rs, rm, sep),
    magnitude: sep >= rs + rm ? 0.0

// back.  Without asking for the extension, RGBA32F is not renderable and the
// framebuffer silently comes back incomplete with every draw discarded.
const FLOAT_TARGETS = gl.getExtension('EXT_color_buffer_float');

function compile(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))

  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));

    return;
  }

  vec3 ocean = vec3(0.075, 0.130, 0.225);
  vec3 base = mix(ocean * 0.35, ocean, lit);
  // Coverage darkens the ground steeply near totality, as the eye reports it:
  // half the Sun gone is barely a dimming.
  float shade = pow(covered, 2.2);
  base *= (1.0 - 0.93 * shade);
  // A little warmth low in the sky, and the deep blue of a total eclipse.
  base = mix(base, vec3(0.22, 0.13, 0.07),
             0.35 * lit * (1.0 - smoothstep(0.0, 14.0, altitude)));
  base = mix(base, vec3(0.02, 0.03, 0.09), 0.75 * smoothstep(0.97, 1.0, covered));
  float rim = pow(1.0 - abs(dot(normalize(vNormal), normalize(-vPos))), 3.0);
  fragColor = vec4(base + vec3(0.05, 0.10, 0.18) * rim * 0.0, 1.0);
}`;

const GLOBE_VS = `#version 300 es
precision highp float;
in vec3 aPos;
uniform mat4 uViewProj;
out vec3 vPos;
out vec3 vNormal;
void main() {
  vPos = aPos;
  vNormal = normalize(aPos);
  gl_Position = uViewProj * vec4(aPos, 1.0);
}`;

const LINE_VS = `#version 300 es
precision highp float;
in vec3 aPos;
uniform mat4 uViewProj;
void main() { gl_Position = uViewProj * vec4(aPos, 1.0); }`;

const LINE_FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec4 uColor;
void main() { fragColor = uColor; }`;

// The Moon is drawn where it is, at the size it is, 60 Earth radii away.  No
// compression: a diagram with the Moon pulled in close would put the shadow
// cone at an angle it does not have, and the cone is the one thing here worth
// looking at.  The camera pulls back instead.
const BODY_VS = `#version 300 es
precision highp float;
in vec3 aPos;
uniform mat4 uViewProj;
uniform vec3 uCentre;
uniform float uRadius;
out vec3 vNormal;
void main() {
  vNormal = normalize(aPos);
  gl_Position = uViewProj * vec4(uCentre + aPos * uRadius, 1.0);
}`;

const BODY_FS = `#version 300 es
precision highp float;
in vec3 vNormal;
out vec4 fragColor;
uniform vec3 uToSun;
uniform vec3 uTint;
void main() {
  float lit = max(0.0, dot(normalize(vNormal), normalize(uToSun)));
  fragColor = vec4(uTint * (0.06 + 0.94 * lit), 1.0);
}`;

const globeProgram = program(GLOBE_VS, GLOBE_FS);
const lineProgram = program(LINE_VS, LINE_FS);
const bodyProgram = program(BODY_VS, BODY_FS);

function buildSphere(rows, columns) {
  const positions = [], indices = [];
  for (let i = 0; i <= rows; i++) {
    const theta = Math.PI * i / rows;
    for (let j = 0; j <= columns; j++) {
      const phi = 2 * Math.PI * j / columns;
      positions.push(Math.sin(theta) * Math.cos(phi),
                     Math.sin(theta) * Math.sin(phi), Math.cos(theta));
    }
  }
  for (let i = 0; i < rows; i++)
    for (let j = 0; j < columns; j++) {
      const a = i * (columns + 1) + j, b = a + columns + 1;
      indices.push(a, b, a + 1, a + 1, b, b + 1);
    }
  return {positions: new Float32Array(positions),
          indices: new Uint16Array(indices)};
}

function buildGlobe(rows, columns) {
  const positions = [], indices = [];
  for (let i = 0; i <= rows; i++) {
    const lat = 90.0 - 180.0 * i / rows;
    for (let j = 0; j <= columns; j++) {
      const p = geodeticToItrf(lat, -180.0 + 360.0 * j / columns);
      positions.push(p[0], p[1], p[2]);
    }
  }
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < columns; j++) {
      const a = i * (columns + 1) + j, b = a + columns + 1;
      indices.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  return {positions: new Float32Array(positions),
          indices: new Uint32Array(indices)};
}

function buffer(data, target) {
  const b = gl.createBuffer();
  gl.bindBuffer(target, b);
  gl.bufferData(target, data, gl.STATIC_DRAW);
  return b;
}

const globe = buildGlobe(180, 360);
const globeVao = gl.createVertexArray();
gl.bindVertexArray(globeVao);
buffer(globe.positions, gl.ARRAY_BUFFER);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
buffer(globe.indices, gl.ELEMENT_ARRAY_BUFFER);
gl.bindVertexArray(null);

// Lines sit a few kilometres proud of the surface so the globe does not
// z-fight them, and so the far side is properly hidden behind it.
function ringsToLines(rings, lift) {
  const points = [], counts = [];
  for (const ring of rings) {
    let n = 0;
    for (let i = 0; i < ring.length; i += 2) {
      const p = geodeticToItrf(ring[i], ring[i + 1]);
      const s = 1.0 + lift;
      points.push(p[0] * s, p[1] * s, p[2] * s);
      n++;
    }
    counts.push(n);
  }
  return {data: new Float32Array(points), counts: counts};
}

function makeLineSet(rings, lift) {
  const built = ringsToLines(rings, lift);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  buffer(built.data, gl.ARRAY_BUFFER);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return {vao: vao, counts: built.counts};
}

const coast = makeLineSet(SCENE.coastlines, 0.0012);
const pathLines = makeLineSet(
  [SCENE.path.centre, SCENE.path.north, SCENE.path.south].filter(r => r.length),
  0.0025);
const graticule = makeLineSet(buildGraticule(), 0.0006);

const moonMesh = buildSphere(48, 96);
const moonVao = gl.createVertexArray();
gl.bindVertexArray(moonVao);
buffer(moonMesh.positions, gl.ARRAY_BUFFER);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
buffer(moonMesh.indices, gl.ELEMENT_ARRAY_BUFFER);
gl.bindVertexArray(null);

// The Moon's track across the eclipse, in the same Earth-fixed frame as
// everything else.  Most of its curve is the Earth turning rather than the
// Moon going round, which is why the panel calls it a track and not an orbit.
const moonTrack = (() => {
  const points = [];
  for (let i = 0; i < SCENE.time.count; i++)
    points.push(SCENE.moon_itrf_km[3 * i], SCENE.moon_itrf_km[3 * i + 1],
                SCENE.moon_itrf_km[3 * i + 2]);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  buffer(new Float32Array(points), gl.ARRAY_BUFFER);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return {vao: vao, counts: [SCENE.time.count]};
})();

// The umbral cone, rebuilt each frame: generators from the Moon's limb to the
// apex where the cone closes, plus the limb itself and the axis.  For a total
// eclipse the apex falls just past the Earth's surface, which is exactly what
// makes it total, and the near half of the cone is drawn over the globe while
// the far half is hidden behind it.
const CONE_RAYS = 32, CONE_STEPS = 24;
const coneBuffer = gl.createBuffer();
const coneVao = gl.createVertexArray();
gl.bindVertexArray(coneVao);
gl.bindBuffer(gl.ARRAY_BUFFER, coneBuffer);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

function coneLines(state) {
  const axis = unit(sub(state.moon, state.sun));
  const separation = len(sub(state.moon, state.sun));
  // Where the umbral cone closes: similar triangles on the Sun and the Moon.
  const apexLength = C.r_moon_km * separation / (C.r_sun_km - C.r_moon_km);
  const apex = [state.moon[0] + axis[0] * apexLength,
                state.moon[1] + axis[1] * apexLength,
                state.moon[2] + axis[2] * apexLength];
  let helper = Math.abs(axis[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  const e1 = unit(cross(axis, helper)), e2 = cross(axis, e1);
  const points = [], counts = [];
  for (let k = 0; k < CONE_RAYS; k++) {
    const a = 2 * Math.PI * k / CONE_RAYS;
    const rim = [state.moon[0] + (e1[0] * Math.cos(a) + e2[0] * Math.sin(a)) * C.r_moon_km,
                 state.moon[1] + (e1[1] * Math.cos(a) + e2[1] * Math.sin(a)) * C.r_moon_km,
                 state.moon[2] + (e1[2] * Math.cos(a) + e2[2] * Math.sin(a)) * C.r_moon_km];
    for (let s = 0; s <= CONE_STEPS; s++) {
      const t = s / CONE_STEPS;
      points.push(rim[0] + (apex[0] - rim[0]) * t,
                  rim[1] + (apex[1] - rim[1]) * t,
                  rim[2] + (apex[2] - rim[2]) * t);
    }
    counts.push(CONE_STEPS + 1);
  }
  return {points: new Float32Array(points), counts: counts};
}

function buildGraticule() {
  const rings = [];
  for (let lat = -60; lat <= 60; lat += 30) {
    const ring = [];
    for (let lon = -180; lon <= 180; lon += 3) ring.push(lat, lon);
    rings.push(ring);
  }
  for (let lon = -180; lon < 180; lon += 30) {
    const ring = [];
    for (let lat = -90; lat <= 90; lat += 3) ring.push(lat, lon);
    rings.push(ring);
  }
  return rings;
}

// ----------------------------------------------------------------- camera ---

const camera = {longitude: 20, latitude: 15, distance: 3.2, target: [0, 0, 0]};
const MAX_DISTANCE = 220;

// Every pointer currently down, so that one finger turns the globe and two
// pinch it.  A phone has no wheel, and without this there is no way to zoom
// at all -- the globe would be stuck at whatever distance it loaded with.
const pointers = new Map();
let pinch = null;

function zoomTo(distance) {
  camera.distance = Math.max(1.25, Math.min(MAX_DISTANCE, distance));
}

function fingerGap() {
  const [a, b] = Array.from(pointers.values());
  return Math.hypot(a.x - b.x, a.y - b.y);
}

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  canvas.setPointerCapture(e.pointerId);
  pinch = pointers.size === 2 ? fingerGap() : null;
});

function liftPointer(e) {
  pointers.delete(e.pointerId);
  pinch = pointers.size === 2 ? fingerGap() : null;
}
canvas.addEventListener('pointerup', liftPointer);
canvas.addEventListener('pointercancel', liftPointer);

canvas.addEventListener('pointermove', e => {
  const was = pointers.get(e.pointerId);
  if (!was) return;
  const now = {x: e.clientX, y: e.clientY};
  pointers.set(e.pointerId, now);
  if (pointers.size >= 2) {
    const gap = fingerGap();
    if (pinch && gap > 0) zoomTo(camera.distance * pinch / gap);
    pinch = gap;
    return;
  }
  camera.longitude -= (now.x - was.x) * 0.35;
  camera.latitude = Math.max(-89, Math.min(89,
                    camera.latitude + (now.y - was.y) * 0.35));
  document.getElementById('follow').checked = false;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomTo(camera.distance * Math.exp(e.deltaY * 0.0012));
}, {passive: false});

function lookAt(eye, target, up) {
  const f = unit(sub(target, eye));
  const s = unit(cross(f, up));
  const u = cross(s, f);
  return [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0,
          -dot(s, eye), -dot(u, eye), dot(f, eye), 1];
}

function perspective(fovy, aspect, near, far) {
  const t = 1.0 / Math.tan(fovy / 2);
  return [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + near) / (near - far), -1,
          0, 0, 2 * far * near / (near - far), 0];
}

function multiply(a, b) {
  const out = new Float32Array(16);
  for (let i = 0; i < 4; i++)
    for (let j = 0; j < 4; j++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += a[k * 4 + j] * b[i * 4 + k];
      out[i * 4 + j] = v;
    }
  return out;
}

function viewProjection(aspect) {
  const r = C.earth_a_km * camera.distance;
  const lat = camera.latitude * Math.PI / 180, lon = camera.longitude * Math.PI / 180;
  const t = camera.target;
  const eye = [t[0] + r * Math.cos(lat) * Math.cos(lon),
               t[1] + r * Math.cos(lat) * Math.sin(lon),
               t[2] + r * Math.sin(lat)];
  const view = lookAt(eye, t, [0, 0, 1]);
  const proj = perspective(45 * Math.PI / 180, aspect,
                           C.earth_a_km * 0.02, C.earth_a_km * 900);
  return {matrix: multiply(proj, view), eye: eye};
}

// ------------------------------------------------------------------- time ---

const T0 = SCENE.time.first_contact_tt, T1 = SCENE.time.last_contact_tt;
let tt = SCENE.time.greatest_tt;
let playing = false;
let rate = 240;                              // seconds of eclipse per second
let lastFrame = null;

function clockText(tt) {
  const seconds = SCENE.time.utc0_seconds + (tt - SCENE.time.tt0) * 86400.0;
  const s = ((seconds % 86400) + 86400) % 86400;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' +
         String(Math.floor(s % 60)).padStart(2, '0');
}

// Where the shadow's axis meets the globe, found by walking the line from the
// Moon away from the Sun into the ellipsoid.  The same intersection the
// package solves, and only needed for the readouts and the follow camera.
function axisPoint(state) {
  const o = state.moon, d = unit(sub(state.moon, state.sun));
  const k = C.earth_a_km / C.earth_b_km;
  const os = [o[0], o[1], o[2] * k], ds = unit([d[0], d[1], d[2] * k]);
  const b = dot(os, ds), c = dot(os, os) - C.earth_a_km * C.earth_a_km;
  const disc = b * b - c;
  if (disc < 0) return null;
  const s = -b - Math.sqrt(disc);
  const p = [os[0] + ds[0] * s, os[1] + ds[1] * s, (os[2] + ds[2] * s) / k];
  const lon = Math.atan2(p[1], p[0]) * 180 / Math.PI;
  const lat = Math.atan2(p[2], Math.hypot(p[0], p[1]) * (1 - E2)) * 180 / Math.PI;
  return {latitude: lat, longitude: lon};
}

// -------------------------------------------------------------------- ui ----

const el = id => document.getElementById(id);
const E = SCENE.eclipse;
el('title').textContent = E.type_name + ' eclipse of ' + E.date;
el('standfirst').textContent = E.central
  ? ('Greatest at ' + E.greatest_utc.slice(11, 19) + ' UTC, ' +
     (E.obscuration * 100).toFixed(2) + '% covered, band ' +
     (E.path_width_km ? E.path_width_km.toFixed(0) + ' km wide' : 'traced') + '.')
  : ('Partial everywhere; at most ' + (E.obscuration * 100).toFixed(1) +
     '% of the Sun is hidden.');
el('foot').innerHTML = 'Shadow computed per pixel from JPL DE440s positions, ' +
  'with the same circle overlap the eclipsepath package uses. ' +
  'Saros ' + E.saros + ', gamma ' + E.gamma.toFixed(3) + '. ' +
  'The Moon is at its true distance and size, so the cone has the angle it ' +
  'really has; its track is drawn in the same Earth-fixed frame as the globe, ' +
  'which means most of that curve is the Earth turning.';

el('infoToggle').addEventListener('click', () => {
  const shut = el('info').classList.toggle('shut');
  el('infoToggle').textContent = shut ? 'Info' : 'Hide';
  el('infoToggle').setAttribute('aria-expanded', String(!shut));
});
// Start out of the way on a small screen, where the open card would cover the
// thing it is describing.  The transport stays: it is the one control there is
// no other way to reach, and it takes a strip along the bottom either way.
if (window.innerWidth < 720) el('infoToggle').click();

// The timeline's fixed marks, set once.  The gold band is the stretch during
// which the umbra is somewhere on the ground -- absent for a partial, which
// never has one, and then the band is simply not drawn.
(function markTimeline() {
  const place = value => (100.0 * (value - T0) / (T1 - T0)) + '%';
  el('mark').style.left = 'calc(' + place(SCENE.time.greatest_tt) + ' - 1px)';
  const from = SCENE.time.central_start_tt, to = SCENE.time.central_end_tt;
  if (from === null || to === null || from === undefined) {
    el('band').style.display = 'none';
    return;
  }
  el('band').style.left = place(from);
  el('band').style.width = (100.0 * (to - from) / (T1 - T0)) + '%';
})();

el('scrub').addEventListener('input', () => {
  tt = T0 + (T1 - T0) * el('scrub').value / 1000.0;
  playing = false; el('play').textContent = 'Play';
});
el('play').addEventListener('click', () => {
  playing = !playing;
  if (playing && tt >= T1 - 1e-9) tt = T0;
  el('play').textContent = playing ? 'Pause' : 'Play';
});
let wideView = false;
el('wide').addEventListener('click', () => {
  wideView = !wideView;
  el('wide').textContent = wideView ? 'Back to the Earth' : 'Show the Moon';
  el('showCone').checked = wideView;
  if (!wideView) {
    camera.target = [0, 0, 0];
    camera.distance = 3.2;
    return;
  }
  // Aim between the two rather than at the Earth.  Orbiting the Earth's centre
  // and pulling back until the Moon comes into frame wastes most of the
  // picture on the far side of the Earth and leaves the Earth two pixels
  // across; framing the pair puts each of them near an edge instead.  There is
  // no getting away from the ratio -- the Moon really is sixty Earth radii off
  // and a quarter the size -- but this is as close as honest framing gets.
  const moon = stateAt(tt).moon;
  camera.target = [moon[0] / 2, moon[1] / 2, moon[2] / 2];
  camera.distance = len(moon) / C.earth_a_km / 2
                    / Math.tan(22.5 * Math.PI / 180) * 1.15;
  camera.latitude = 55;
});
el('faster').addEventListener('click', () => { rate = Math.min(3840, rate * 2); showRate(); });
el('slower').addEventListener('click', () => { rate = Math.max(15, rate / 2); showRate(); });
function showRate() { el('rate').textContent = rate + '×'; }
showRate();

// ------------------------------------------------------------------ draw ----

const bodyUniforms = {};
for (const name of ['uViewProj', 'uCentre', 'uRadius', 'uToSun', 'uTint'])
  bodyUniforms[name] = gl.getUniformLocation(bodyProgram, name);
const uniforms = {};
for (const name of ['uViewProj', 'uSun', 'uMoon', 'uRSun', 'uRMoon', 'uE2',
                    'uHorizon', 'uMode'])
  uniforms[name] = gl.getUniformLocation(globeProgram, name);
const lineUniforms = {
  uViewProj: gl.getUniformLocation(lineProgram, 'uViewProj'),
  uColor: gl.getUniformLocation(lineProgram, 'uColor'),
};

function drawLineSet(set, colour, matrix) {
  gl.useProgram(lineProgram);
  gl.uniformMatrix4fv(lineUniforms.uViewProj, false, matrix);
  gl.uniform4fv(lineUniforms.uColor, colour);
  gl.bindVertexArray(set.vao);
  let start = 0;
  for (const count of set.counts) {
    gl.drawArrays(gl.LINE_STRIP, start, count);
    start += count;
  }
}

function render(mode) {
  const width = canvas.clientWidth, height = canvas.clientHeight;
  const scale = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.floor(width * scale)) {
    canvas.width = Math.floor(width * scale);
    canvas.height = Math.floor(height * scale);
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.043, 0.05, 0.07, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const state = stateAt(tt);
  const camera3 = viewProjection(canvas.width / canvas.height);
  gl.useProgram(globeProgram);
  gl.uniformMatrix4fv(uniforms.uViewProj, false, camera3.matrix);
  gl.uniform3fv(uniforms.uSun, new Float32Array(state.sun));
  gl.uniform3fv(uniforms.uMoon, new Float32Array(state.moon));
  gl.uniform1f(uniforms.uRSun, C.r_sun_km);
  gl.uniform1f(uniforms.uRMoon, C.r_moon_km);
  gl.uniform1f(uniforms.uE2, E2);
  gl.uniform1f(uniforms.uHorizon, C.horizon_altitude_deg);
  gl.uniform1i(uniforms.uMode, mode || 0);
  gl.bindVertexArray(globeVao);
  gl.drawElements(gl.TRIANGLES, globe.indices.length, gl.UNSIGNED_INT, 0);

  if (!mode) {
    drawLineSet(graticule, [1, 1, 1, 0.06], camera3.matrix);
    if (el('showCoast').checked)
      drawLineSet(coast, [0.60, 0.68, 0.78, 0.55], camera3.matrix);
    if (el('showPath').checked)
      drawLineSet(pathLines, [0.83, 0.63, 0.09, 0.95], camera3.matrix);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    if (el('showCone').checked) {
      const cone = coneLines(state);
      gl.bindVertexArray(coneVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, coneBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, cone.points, gl.DYNAMIC_DRAW);
      drawLineSet({vao: coneVao, counts: cone.counts},
                  [0.35, 0.55, 0.85, 0.16], camera3.matrix);
      drawLineSet(moonTrack, [0.55, 0.60, 0.70, 0.35], camera3.matrix);
    }
    gl.disable(gl.BLEND);

    gl.useProgram(bodyProgram);
    gl.uniformMatrix4fv(bodyUniforms.uViewProj, false, camera3.matrix);
    gl.uniform3fv(bodyUniforms.uCentre, new Float32Array(state.moon));
    gl.uniform1f(bodyUniforms.uRadius, C.r_moon_km);
    gl.uniform3fv(bodyUniforms.uToSun,
                  new Float32Array(unit(sub(state.sun, state.moon))));
    gl.uniform3fv(bodyUniforms.uTint, new Float32Array([0.78, 0.76, 0.72]));
    gl.bindVertexArray(moonVao);
    gl.drawElements(gl.TRIANGLES, moonMesh.indices.length, gl.UNSIGNED_SHORT, 0);
  }
  return state;
}

function readouts(state) {
  el('clock').textContent = clockText(tt) + ' UTC';
  const through = (tt - T0) / (T1 - T0);
  el('scrub').value = Math.round(1000 * through);
  el('fill').style.width = (100.0 * Math.min(1, Math.max(0, through))) + '%';
  const axis = axisPoint(state);
  if (axis) {
    const seen = circumstancesAt(axis.latitude, axis.longitude, tt);
    el('peak').textContent = (seen.obscuration * 100).toFixed(2) + '%';
    el('where').textContent =
      Math.abs(axis.latitude).toFixed(2) + (axis.latitude >= 0 ? '°N ' : '°S ') +
      Math.abs(axis.longitude).toFixed(2) + (axis.longitude >= 0 ? '°E' : '°W');
    el('alt').textContent = seen.sun_altitude.toFixed(1) + '°';
    if (el('follow').checked && !wideView) {
      camera.longitude = axis.longitude;
      camera.latitude = axis.latitude;
    }
  } else {
    el('peak').textContent = '—';
    el('where').textContent = 'axis misses the Earth';
    el('alt').textContent = '—';
  }
}

function frame(now) {
  if (playing) {
    if (lastFrame !== null)
      tt += (now - lastFrame) / 1000.0 * rate / 86400.0;
    if (tt >= T1) { tt = T1; playing = false; el('play').textContent = 'Play'; }
  }
  if (wideView) {
    const moon = stateAt(tt).moon;
    camera.target = [moon[0] / 2, moon[1] / 2, moon[2] / 2];
  }
  lastFrame = now;
  readouts(render(0));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// A hook for the test harness: render one pixel's worth of the shader's own
// arithmetic into a float target and hand the number back, so the shader can
// be held to the package rather than to a screenshot.
window.eclipseShaderProbe = function (latitude, longitude, atTt) {
  const previous = tt;
  tt = atTt;
  const target = gl.createFramebuffer();
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 1, 1, 0, gl.RGBA, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D,
                          texture, 0);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (status !== gl.FRAMEBUFFER_COMPLETE) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    tt = previous;
    throw new Error('float framebuffer unavailable (status ' + status + ', ' +
                    'EXT_color_buffer_float ' +
                    (FLOAT_TARGETS ? 'present' : 'missing') + ')');
  }
  const out = probeAt(latitude, longitude);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(target);
  gl.deleteTexture(texture);
  tt = previous;
  return out;
};

// One triangle covering the single-pixel target, carrying the ITRF position of
// the place being asked about, so the globe's own fragment shader runs on it.
const PROBE_VS = `#version 300 es
precision highp float;
in vec3 aPos;
out vec3 vPos;
out vec3 vNormal;
void main() {
  vPos = aPos;
  vNormal = normalize(aPos);
  gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
  gl_PointSize = 1.0;
}`;
const probeProgram = program(PROBE_VS, GLOBE_FS);
const probeUniforms = {};
for (const name of ['uSun', 'uMoon', 'uRSun', 'uRMoon', 'uE2', 'uHorizon', 'uMode'])
  probeUniforms[name] = gl.getUniformLocation(probeProgram, name);
const probeBuffer = gl.createBuffer();
const probeVao = gl.createVertexArray();
gl.bindVertexArray(probeVao);
gl.bindBuffer(gl.ARRAY_BUFFER, probeBuffer);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

function probeAt(latitude, longitude) {
  const p = geodeticToItrf(latitude, longitude);
  const state = stateAt(tt);
  gl.viewport(0, 0, 1, 1);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(probeProgram);
  gl.uniform3fv(probeUniforms.uSun, new Float32Array(state.sun));
  gl.uniform3fv(probeUniforms.uMoon, new Float32Array(state.moon));
  gl.uniform1f(probeUniforms.uRSun, C.r_sun_km);
  gl.uniform1f(probeUniforms.uRMoon, C.r_moon_km);
  gl.uniform1f(probeUniforms.uE2, E2);
  gl.uniform1f(probeUniforms.uHorizon, C.horizon_altitude_deg);
  gl.uniform1i(probeUniforms.uMode, 1);
  gl.bindVertexArray(probeVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, probeBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(p), gl.STATIC_DRAW);
  gl.drawArrays(gl.POINTS, 0, 1);
  const pixel = new Float32Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, pixel);
  return {obscuration: pixel[0],
          sun_altitude: (pixel[1] - 0.5) * 180.0,
          separation: pixel[2]};
}
</script>
